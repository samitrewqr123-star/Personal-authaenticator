<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<title>Authenticator</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#12131a;--mut:#6b7090;--ac:#5b6cff;--ac2:#8f5bff;--bd:#e6e8f3;--warn:#e8590c;--danger:#d93025;--ok:#1a9d57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c12;--card:#151722;--tx:#f2f3fa;--mut:#8b90ab;--ac:#7c8bff;--ac2:#b07cff;--bd:#262a3d;--warn:#ffb454;--danger:#ff8a80;--ok:#5fd68f}}
:root[data-theme="dark"]{--bg:#0b0c12;--card:#151722;--tx:#f2f3fa;--mut:#8b90ab;--ac:#7c8bff;--ac2:#b07cff;--bd:#262a3d;--warn:#ffb454;--danger:#ff8a80;--ok:#5fd68f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(600px 300px at 15% -5%,color-mix(in srgb,var(--ac) 28%,transparent),transparent),radial-gradient(500px 300px at 100% 0,color-mix(in srgb,var(--ac2) 22%,transparent),transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px;gap:10px}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px;cursor:pointer;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(20,20,60,.08);animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.r{display:flex;align-items:center;gap:14px}
.av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex:none}
.mid{flex:1;min-width:0}
.iss{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nr{cursor:pointer}
.chev{color:var(--mut);font-size:22px}
.code{font-size:32px;font-weight:700;letter-spacing:3px;margin-top:10px;font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.code.w{background:none;color:var(--warn)}
.ring{position:relative;width:42px;height:42px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--mut)}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-size:32px;box-shadow:0 10px 26px rgba(92,80,255,.45);cursor:pointer}
.sheet{display:none;position:fixed;inset:0;background:rgba(5,6,12,.6);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
#dlg{z-index:30}
.panel{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:in .25s ease both;max-height:90vh;overflow-y:auto}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.btns{display:flex;gap:10px;margin-top:16px}
button.pri,.btns button{flex:1;padding:14px;border-radius:14px;border:0;font-size:16px;font-weight:600;cursor:pointer;color:var(--tx);background:var(--bd)}
button.pri,.btns .ok{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.menu{padding:6px 16px}
.menu button{display:block;width:100%;text-align:left;padding:15px 4px;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);font-size:16px;cursor:pointer}
.menu button:last-child{border-bottom:0}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.empty{text-align:center;color:var(--mut);margin-top:70px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#20222e;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90%;text-align:center}
.toast.on{opacity:1}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:20px;z-index:10;text-align:center;overflow-y:auto;background:radial-gradient(600px 400px at 50% -10%,color-mix(in srgb,var(--ac) 30%,transparent),transparent),var(--bg)}
.scr.on{display:flex}
.scr .box{margin:auto;width:100%;max-width:340px}
.scr p{color:var(--mut);margin:6px 0 18px;font-size:14px;line-height:1.5}
.logo{font-size:44px;margin-bottom:6px}
.box input{margin-bottom:10px}
.tabs{display:flex;background:var(--bd);border-radius:14px;padding:4px;margin:14px 0}
.tabs button{flex:1;padding:10px;border:0;border-radius:11px;background:none;color:var(--mut);font-weight:600;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(20,20,60,.12)}
.ok-msg{color:var(--ok);font-size:13px;min-height:18px;margin-bottom:6px}
#dots,.vd{display:flex;gap:14px;margin-bottom:10px;justify-content:center}
#dots.sh{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#dots i,.vd i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut);transition:.15s}
#dots i.f,.vd i.f{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;transform:scale(1.15)}
#pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin:14px 0 4px;justify-content:center}
#pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:26px;cursor:pointer}
#pad button:active{background:var(--bd)}
.lk{background:none;border:0;color:var(--mut);font-size:13px;margin:8px 6px;text-decoration:underline;cursor:pointer}
.rcode{font-size:20px;font-weight:700;letter-spacing:1.5px;padding:18px 10px;border-radius:16px;border:1px dashed var(--ac);margin:8px 0 14px;word-break:break-all}
.box .pri{width:100%;margin-top:10px;flex:none}
#rcin{text-align:center;letter-spacing:2px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:22px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;text-align:left;box-shadow:0 8px 24px rgba(20,20,60,.08);animation:in .35s ease both}
.cat b{font-size:16px}.cat small{color:var(--mut);font-size:12px}
.ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
.g3{grid-template-columns:repeat(3,1fr);gap:8px}
.g3 .cat{padding:12px 4px;align-items:center;text-align:center;box-shadow:none;gap:6px}
.g3 .cat b{font-size:12px}.g3 small{display:none}
.mic{width:130px;height:130px;border-radius:50%;border:0;margin:10px auto 14px;display:grid;place-items:center;font-size:44px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 30px rgba(92,80,255,.4)}
.mic span{font-size:14px;font-weight:600;display:block;margin-top:-18px}
.mic.rec{background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.st{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:10px 0 0;color:var(--mut)}
.st b{color:var(--tx);font-weight:600;text-align:right}
</style>
</head>
<body>

<!-- ============ Login / Sign up ============ -->
<div id="auth" class="scr on"><div class="box">
  <div class="logo">🔐</div><h1>Authenticator</h1>
  <div class="tabs"><button id="tl" class="on">Login</button><button id="ts">Sign up</button></div>
  <div id="fl">
    <input id="li" placeholder="Username / Gmail / Number" autocomplete="username" autocapitalize="off">
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
    <button class="pri" id="lgo">Login</button>
  </div>
  <div id="fs" hidden>
    <input id="su" placeholder="Username" autocomplete="off" autocapitalize="off">
    <input id="se" type="email" placeholder="Gmail" autocomplete="email" autocapitalize="off">
    <input id="sn" type="tel" placeholder="Phone number" autocomplete="tel">
    <input id="sp" type="password" placeholder="Password (kom pokkhe 6 ta)" autocomplete="new-password">
    <button class="pri" id="sgo">Sign up</button>
  </div>
  <div class="ok-msg" id="aok"></div><div class="err" id="ae"></div>
</div></div>

<!-- ============ Passcode ============ -->
<div id="lock" class="scr"><div class="box">
  <div class="logo">🔐</div>
  <h1 id="lt"></h1><p id="ls"></p>
  <div id="dots"></div>
  <div id="recbox" hidden><input id="rcin" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off"><button class="pri" id="rcgo">Continue</button></div>
  <div id="pad"></div>
  <div class="err" id="le"></div>
  <div><button class="lk" id="fg">Passcode bhule gechi</button><button class="lk" id="lo">Logout</button><button class="lk" id="bk" hidden>Back</button></div>
</div></div>

<!-- ============ Recovery code ============ -->
<div id="rcs" class="scr"><div class="box">
  <div class="logo">🗝️</div><h1>Recovery code</h1>
  <p>Passcode bhule gele ei code diye notun passcode set korte parbe, sob account thakbe. Kothao save kore rakho (nijeke email koro ba likhe rakho).</p>
  <div class="rcode" id="rcc"></div>
  <button class="pri" id="rccp">Copy</button>
  <button class="pri" id="rcem">Gmail e nijeke pathao</button>
  <button class="pri" id="rcok" style="margin-top:22px">Ami save korechi</button>
</div></div>

<!-- ============ Biometric ============ -->
<div id="bio" class="scr"><div class="box">
  <div class="logo">🧬</div><h1 id="bt"></h1><p id="bs"></p>
  <button class="pri" id="bgo">Fingerprint / Face</button>
  <div class="err" id="be"></div>
  <button class="pri" id="bfb" hidden style="background:var(--bd);color:var(--tx)">Biometric chhara passcode diye chalabo</button>
  <div><button class="lk" id="brs" hidden>Biometric kaj korche na? Password diye reset</button><button class="lk" id="bbk">Back</button></div>
</div></div>

<!-- ============ Voice lock ============ -->
<div id="voice" class="scr"><div class="box">
  <h1 id="vt"></h1><p id="vs"></p>
  <div class="vd" id="vd"><i></i><i></i><i></i></div>
  <button class="mic" id="vmic" aria-label="Record voice">🎙️<span id="vmt">Tap</span></button>
  <div class="err" id="ve"></div>
  <button class="pri" id="vfb" hidden style="background:var(--bd);color:var(--tx)">Mic chhara passcode diye chalabo</button>
  <div><button class="lk" id="vrs" hidden>Voice kaj korche na? Password diye notun voice set</button><button class="lk" id="vbk">Back</button></div>
</div></div>

<!-- ============ App ============ -->
<div id="app" style="display:none">
  <div id="home"><div class="wrap">
    <div class="top"><h1>Authenticator</h1><button class="ib" id="gear" aria-label="Settings">⚙️</button></div>
    <div id="hgrid" class="grid"></div>
  </div></div>

  <div id="catv" hidden><div class="wrap">
    <div class="top"><button class="ib" id="cb" aria-label="Back">‹</button><h1 id="ct" style="flex:1"></h1><span style="width:42px"></span></div>
    <div id="nlist"></div>
  </div></div>

  <div id="setv" hidden><div class="wrap">
    <div class="top"><button class="ib" id="sb" aria-label="Back">‹</button><h1 style="flex:1">Settings</h1><span style="width:42px"></span></div>
    <div class="card" id="pf"></div>
    <div class="card menu">
      <button id="rbio">🧬 Biometric abar set koro</button>
      <button id="rvc">🎙️ Voice abar set koro</button>
      <button id="nrc">🗝️ Notun recovery code</button>
      <button id="bkc">📋 Backup copy koro</button>
      <button id="bke">✉️ Backup Gmail e pathao</button>
      <button id="bkr">♻️ Backup restore</button>
      <button id="lkn">🔒 Ekhoni lock koro</button>
    </div>
    <div class="card menu"><button id="lo2" style="color:var(--danger)">🚪 Logout</button></div>
  </div></div>

  <button class="fab" id="add" aria-label="Add account">+</button>

  <div class="sheet" id="sheet"><div class="panel">
    <div id="s1">
      <strong style="font-size:18px">Kon app-er account add korbe?</strong>
      <div class="grid g3" id="cgrid" style="margin-top:14px"></div>
      <div class="btns"><button id="cancel">Cancel</button></div>
    </div>
    <div id="s2" hidden>
      <strong style="font-size:18px" id="s2t"></strong>
      <label>Name (jemon: me@gmail.com)</label>
      <input id="nm" autocomplete="off">
      <label>2FA security code (secret key ba otpauth:// link)</label>
      <input id="sk" autocomplete="off" autocapitalize="characters" placeholder="JBSWY3DPEHPK3PXP">
      <div class="err" id="err"></div>
      <div class="btns"><button id="sback">Back</button><button class="ok" id="save">Save</button></div>
    </div>
  </div></div>

  <div class="sheet" id="csheet"><div class="panel" style="text-align:center">
    <div class="av" id="cav" style="margin:0 auto 8px"></div>
    <div class="iss" id="cnm"></div><div class="acc" id="ccat"></div>
    <div class="code" id="ccode" style="font-size:40px"></div>
    <div class="ring" style="margin:12px auto 0"><svg width="42" height="42"><circle cx="21" cy="21" r="16" fill="none" stroke="var(--bd)" stroke-width="3"/><circle id="cring" cx="21" cy="21" r="16" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="100.53" style="stroke:var(--ac);transition:stroke-dashoffset 1s linear"/></svg><b id="cleft"></b></div>
    <div class="acc" style="margin-top:8px">Code-e tap korle copy hobe</div>
    <div class="btns"><button id="cdel" style="color:var(--danger)">Delete</button><button class="ok" id="cclose">Close</button></div>
  </div></div>
</div>

<!-- ============ Dialog ============ -->
<div class="sheet" id="dlg"><div class="panel">
  <strong style="font-size:18px" id="dt"></strong>
  <p style="color:var(--mut);font-size:14px;margin:8px 0 0;line-height:1.5" id="dm"></p>
  <input id="di" style="margin-top:12px" autocomplete="off">
  <div class="btns"><button id="dc">Cancel</button><button class="ok" id="dok">OK</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const UK='auth_users_v3',SK='auth_sess_v3',$=id=>document.getElementById(id),E=new TextEncoder(),D=new TextDecoder();
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64=u=>btoa(String.fromCharCode(...u)),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['Facebook','f','#1877f2'],['Gmail','G','#ea4335'],['Instagram','I','#d6249f'],['X / Twitter','X','#14171a'],['WhatsApp','W','#25a244'],['Telegram','T','#229ed9'],['TikTok','♪','#111'],['GitHub','Gh','#24292e'],['Microsoft','M','#0078d4'],['Apple','A','#6e6e73'],['Amazon','a','#ff9900'],['Discord','D','#5865f2'],['LinkedIn','in','#0a66c2'],['Binance','B','#d9a400'],['Other','＋','#7a7f9a']];
const catOf=n=>CATS.find(c=>c[0]===n)||CATS[CATS.length-1];
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};

let users=[],cur=null,mk=null,key=null,data=null,mode='',pin='',tmp='',busy=false,tries=0,ltries=0,native=false,inApp=false,view='home',curCat=null,addCat=null,ci=null,cexp=0,rcNext=null,gating=false,saving=false;
const getU=()=>{try{return JSON.parse(localStorage.getItem(UK)||'[]')}catch(e){return[]}};
const putU=()=>{try{localStorage.setItem(UK,JSON.stringify(users))}catch(e){}};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}

/* ---------- crypto ---------- */
async function derive(sec,s){const m=await crypto.subtle.importKey('raw',E.encode(sec),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function wrap(raw,sec){const s=rnd(16),iv=rnd(12),k=await derive(sec,s);return{s:b64(s),iv:b64(iv),d:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,raw)))}}
async function unwrap(w,sec){const k=await derive(sec,ub(w.s));return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(w.iv)},k,ub(w.d)))}
async function useMk(raw){mk=raw;key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function save(){const iv=rnd(12);cur.vault.iv=b64(iv);cur.vault.d=b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,E.encode(JSON.stringify(data)))));putU()}
async function load(){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(cur.vault.iv)},key,ub(cur.vault.d));let d=JSON.parse(D.decode(pt));
  if(Array.isArray(d))d={a:d.map(a=>({...a,cat:a.cat||(CATS.find(c=>a.name.toLowerCase().includes(c[0].toLowerCase()))||CATS[CATS.length-1])[0]})),v:null}; /* purano backup */
  d.a=d.a||[];d.v=d.v||null;data=d;
}
function genCode(){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',r=rnd(16);return[0,1,2,3].map(i=>[...r.slice(i*4,i*4+4)].map(x=>A[x%32]).join('')).join('-')}
async function hashPw(pw,salt){const m=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,256)))}
async function pwOK(u,pw){try{return(await hashPw(pw,ub(u.ps)))===u.pw}catch(e){return false}}
async function askPw(msg){const p=await dlg({t:'Password dao',m:msg,input:'pw'});if(!p)return false;if(await pwOK(cur,p))return true;toast('Password thik na');return false}

/* ---------- dialog ---------- */
function dlg({t,m='',input=null,ok='OK',cancel=true}){return new Promise(res=>{
  $('dt').textContent=t;$('dm').textContent=m;const i=$('di');i.hidden=!input;i.value='';i.removeAttribute('maxlength');
  if(input==='pin'){i.type='password';i.inputMode='numeric';i.maxLength=6;i.placeholder='6 digit passcode'}
  else if(input==='pw'){i.type='password';i.inputMode='text';i.placeholder='Password'}
  else if(input==='text'){i.type='text';i.inputMode='text';i.placeholder='Paste koro'}
  $('dok').textContent=ok;$('dc').hidden=!cancel;$('dlg').classList.add('on');
  const done=v=>{$('dlg').classList.remove('on');i.onkeydown=null;res(v)};
  $('dok').onclick=()=>done(input?i.value:true);$('dc').onclick=()=>done(input?'':false);
  i.onkeydown=e=>{if(e.key==='Enter')$('dok').click()};
  if(input)setTimeout(()=>i.focus(),60);
})}

/* ---------- login / sign up ---------- */
const normPh=s=>s.replace(/[\s\-()]/g,'');
function tab(l){$('tl').classList.toggle('on',l);$('ts').classList.toggle('on',!l);$('fl').hidden=!l;$('fs').hidden=l;$('ae').textContent=''}
$('tl').onclick=()=>{tab(true);$('aok').textContent=''};$('ts').onclick=()=>{tab(false);$('aok').textContent=''};
function showAuth(){inApp=false;cur=null;key=mk=data=null;$('app').style.display='none';['li','lp','su','se','sn','sp'].forEach(i=>$(i).value='');tab(true);show('auth')}
$('sgo').onclick=async()=>{
  if(busy)return;const un=$('su').value.trim(),em=$('se').value.trim().toLowerCase(),ph=normPh($('sn').value),pw=$('sp').value,e=$('ae');$('aok').textContent='';
  if(!/^[A-Za-z0-9_.]{3,20}$/.test(un))return e.textContent='Username 3-20 ta akkhor (a-z, 0-9, _ .)';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return e.textContent='Gmail ta thik na';
  if(!/^\+?\d{7,15}$/.test(ph))return e.textContent='Phone number thik na';

/* ---------- voice lock (approximate MFCC voiceprint) ---------- */
/*DSP*/
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
for(let l=2;l<=n;l<<=1){const a=-2*Math.PI/l,wr=Math.cos(a),wi=Math.sin(a);for(let i=0;i<n;i+=l){let cr=1,ci=0;for(let k=0;k<l/2;k++){const u=i+k,v=i+k+l/2,xr=re[v]*cr-im[v]*ci,xi=re[v]*ci+im[v]*cr;re[v]=re[u]-xr;im[v]=im[u]-xi;re[u]+=xr;im[u]+=xi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}
const mel=f=>2595*Math.log10(1+f/700),imel=m=>700*(Math.pow(10,m/2595)-1);
function mfb(sr,N,nf){const lo=mel(100),hi=mel(Math.min(5000,sr/2*.95)),p=[];for(let i=0;i<nf+2;i++)p.push(Math.floor((N+1)*imel(lo+(hi-lo)*i/(nf+1))/sr));const F=[];for(let m=1;m<=nf;m++){const f=new Float32Array(N/2+1);for(let k=p[m-1];k<p[m];k++)f[k]=(k-p[m-1])/(p[m]-p[m-1]||1);for(let k=p[m];k<=p[m+1];k++)f[k]=(p[m+1]-k)/(p[m+1]-p[m]||1);F.push(f)}return F}
function feat(x,sr){
  const N=sr>=32000?1024:512,H=N/2;if(x.length<N*4)return null;
  const y=new Float32Array(x.length);y[0]=x[0];for(let i=1;i<x.length;i++)y[i]=x[i]-.97*x[i-1];
  const nf=Math.floor((y.length-N)/H)+1,en=new Float32Array(nf);
  for(let f=0;f<nf;f++){let s=0;for(let i=0;i<N;i++){const v=x[f*H+i];s+=v*v}en[f]=s/N}
  const q=Array.from(en).sort((a,b)=>a-b)[Math.floor(nf*.9)],thr=q*.1;
  const FB=mfb(sr,N,26),win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/(N-1));
  const re=new Float32Array(N),im=new Float32Array(N),C=[];
  for(let f=0;f<nf;f++){
    if(en[f]<=thr)continue;
    for(let i=0;i<N;i++){re[i]=y[f*H+i]*win[i];im[i]=0}
    fft(re,im);
    const L=FB.map(fl=>{let s=0;for(let k=0;k<=N/2;k++)if(fl[k])s+=fl[k]*(re[k]*re[k]+im[k]*im[k]);return Math.log(s+1e-9)});
    const c=[];for(let j=1;j<=12;j++){let s=0;for(let m=0;m<26;m++)s+=L[m]*Math.cos(Math.PI*j*(m+.5)/26);c.push(s)}
    C.push(c);
  }
  if(C.length<12)return null;
  const mean=[],sd=[];
  for(let j=0;j<12;j++){let s=0;for(const c of C)s+=c[j];const m=s/C.length;let v=0;for(const c of C)v+=(c[j]-m)**2;mean.push(m);sd.push(Math.sqrt(v/C.length)*.5)}
  return mean.concat(sd);
}
const dist=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])**2,0));
/*END*/

const TMIN=5,TMAX=10;
async function record(ms){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)throw new Error('nomic');
  native=true;let st;
  try{
    st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}});
    const mr=new MediaRecorder(st),ch=[];mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
    const stopped=new Promise(r=>mr.onstop=r);mr.start();await sleep(ms);mr.stop();await stopped;
    const ab=await new Blob(ch).arrayBuffer(),ctx=new(window.AudioContext||window.webkitAudioContext)();
    try{const b=await ctx.decodeAudioData(ab);return{x:b.getChannelData(0),sr:b.sampleRate}}finally{ctx.close()}
  }finally{if(st)st.getTracks().forEach(t=>t.stop());native=false}
}
function voiceFlow(m){return new Promise(res=>{
  let n=0,fails=0,F=[],rec=false;
  const ui=()=>{$('vt').textContent=m==='enroll'?'Voice lock set koro':'Voice confirm';
    $('vs').textContent=m==='enroll'?'Mic chepe ekta chhoto kotha bolo (jemon tomar naam). Protibar ekoi kotha bolo.':'Mic chepe tomar set kora kotha ta bolo';
    $('vd').hidden=m!=='enroll';[...$('vd').children].forEach((d,i)=>d.classList.toggle('f',i<n));
    $('vfb').hidden=true;$('vrs').hidden=m!=='verify';$('ve').textContent=''};
  ui();show('voice');
  const end=ok=>{show(null);res(ok)};
  $('vmic').onclick=async()=>{
    if(rec)return;rec=true;$('ve').textContent='';$('vmic').classList.add('rec');$('vmt').textContent='Bolo…';
    try{
      const{x,sr}=await record(2500);$('vmic').classList.remove('rec');$('vmt').textContent='…';
      const f=feat(x,sr);
      if(!f){$('ve').textContent='Voice shona jayni. Mic-er kache, shanto jayga-y abar bolo.';return}
      if(m==='enroll'){
        F.push(f);n++;ui();
        if(n<3){$('ve').textContent=`${n}/3 hoyeche. Abar ekoi kotha bolo.`;return}
        const c=F[0].map((_,i)=>F.reduce((s,v)=>s+v[i],0)/F.length),intra=Math.max(...F.map(v=>dist(v,c)));
        data.v={mode:'voice',c,th:Math.min(Math.max(intra*2,TMIN),TMAX)};await save();toast('Voice set hoyeche');end(true);
      }else{
        if(dist(f,data.v.c)<=data.v.th){end(true)}
        else{fails++;$('ve').textContent=`Voice mile nai (${fails}/3). Abar bolo.`;if(fails>=3)$('vrs').style.fontWeight='700'}
      }
    }catch(e){$('ve').textContent='Mic chalu hoyni ('+(e&&(e.name!=='Error'?e.name:e.message))+'). Phone Settings → App → Permissions → Microphone chalu koro.';if(m==='enroll')$('vfb').hidden=false}
    finally{rec=false;$('vmic').classList.remove('rec');$('vmt').textContent='Tap'}
  };
  $('vfb').onclick=async()=>{data.v={mode:'pin'};await save();end(true)};
  $('vrs').onclick=async()=>{if(!await askPw('Notun voice set korte password dao'))return;data.v=null;await save();m='enroll';n=0;F=[];fails=0;ui()};
  $('vbk').onclick=()=>end(false);
})}

}

/* ---------- totp ---------- */
function b32(s){
  s=s.replace(/[\s=-]/g,'').toUpperCase();
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='',out=[];
  for(const c of s){const i=A.indexOf(c);if(i<0)throw new Error('bad');bits+=i.toString(2).padStart(5,'0')}
  for(let i=0;i+8<=bits.length;i+=8)out.push(parseInt(bits.slice(i,i+8),2));
  if(!out.length)throw new Error('bad');
  return new Uint8Array(out);
}
async function totp(a){
  const p=a.period||30,d=a.digits||6,c=Math.floor(Date.now()/1000/p);
  const buf=new ArrayBuffer(8),v=new DataView(buf);
  v.setUint32(0,Math.floor(c/4294967296));v.setUint32(4,c>>>0);
  const k=await crypto.subtle.importKey('raw',b32(a.secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);
  const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf)),o=h[h.length-1]&15;
  const n=(((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%Math.pow(10,d);
  return String(n).padStart(d,'0');
}
