<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>My Authenticator</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c1f24;--mut:#6b7280;--ac:#1a73e8;--bd:#e5e7eb;--danger:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1c2026;--tx:#eceff4;--mut:#9aa3af;--ac:#6ea8fe;--bd:#2a2f37;--danger:#f28b82}}
:root[data-theme="dark"]{--bg:#121418;--card:#1c2026;--tx:#eceff4;--mut:#9aa3af;--ac:#6ea8fe;--bd:#2a2f37;--danger:#f28b82}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.name{color:var(--mut);font-size:14px;word-break:break-all}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.code{font-size:34px;font-weight:600;letter-spacing:4px;color:var(--ac);font-variant-numeric:tabular-nums;cursor:pointer;user-select:none}
.bar{height:4px;background:var(--bd);border-radius:2px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width 1s linear}
.t{font-size:14px;color:var(--mut);min-width:28px;text-align:right}
.del{background:none;border:0;color:var(--danger);font-size:13px;padding:6px 0 0;cursor:pointer}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:13px;border-radius:10px;border:0;font-size:16px;cursor:pointer}
.ok{background:var(--ac);color:#fff}.no{background:var(--bd);color:var(--tx)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.empty{text-align:center;color:var(--mut);margin-top:60px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 Authenticator</h1>
  <div id="list"></div>
</div>
<button class="fab" id="add" aria-label="Add account">+</button>

<div class="sheet" id="sheet">
  <div class="panel">
    <strong>Account add koro</strong>
    <label>Account name (jemon: Gmail)</label>
    <input id="nm" autocomplete="off">
    <label>Secret key ba otpauth:// link</label>
    <input id="sk" autocomplete="off" autocapitalize="characters" placeholder="JBSWY3DPEHPK3PXP">
    <div class="err" id="err"></div>
    <div class="btns"><button class="no" id="cancel">Cancel</button><button class="ok" id="save">Save</button></div>
  </div>
</div>
<div class="toast" id="toast">Copied</div>

<script>
const KEY='my_totp_accounts_v1';
let accts=[];
try{accts=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){accts=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(accts))}catch(e){}}
function b32(s){
  s=s.replace(/[\s=-]/g,'').toUpperCase();
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='',out=[];
  for(const c of s){const i=A.indexOf(c);if(i<0)throw new Error('bad');bits+=i.toString(2).padStart(5,'0')}
  for(let i=0;i+8<=bits.length;i+=8)out.push(parseInt(bits.slice(i,i+8),2));
  if(!out.length)throw new Error('bad');
  return new Uint8Array(out);
}
async function totp(a){
  const p=a.period||30,d=a.digits||6,c=Math.floor(Date.now()/1000/p);
  const buf=new ArrayBuffer(8),v=new DataView(buf);
  v.setUint32(0,Math.floor(c/4294967296));v.setUint32(4,c>>>0);
  const k=await crypto.subtle.importKey('raw',b32(a.secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);
  const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf)),o=h[h.length-1]&15;
  const n=(((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%Math.pow(10,d);
  return String(n).padStart(d,'0');
}
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1200)}
function fmt(c){return c.length===6?c.slice(0,3)+' '+c.slice(3):c}
async function render(){
  const L=$('list');
  if(!accts.length){L.innerHTML='<div class="empty">Kono account nai.<br>Niche <b>+</b> chepe add koro.</div>';return}
  const now=Math.floor(Date.now()/1000);
  const html=await Promise.all(accts.map(async(a,i)=>{
    const p=a.period||30,left=p-(now%p);let c;
    try{c=fmt(await totp(a))}catch(e){c='Error'}
    return `<div class="card"><div class="name">${esc(a.name)}</div>
    <div class="row"><div class="code" data-c="${c.replace(' ','')}">${c}</div><div class="t">${left}s</div></div>
    <div class="bar"><i style="width:${left/p*100}%"></i></div>
    <button class="del" data-i="${i}">Delete</button></div>`;
  }));
  L.innerHTML=html.join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('list').addEventListener('click',async e=>{
  const c=e.target.closest('.code');
  if(c){try{await navigator.clipboard.writeText(c.dataset.c);toast('Copied')}catch(x){toast('Copy hoyni')}}
  const d=e.target.closest('.del');
  if(d&&confirm('Ei account delete korbe? Backup na thakle abar login korte parbe na.')){accts.splice(+d.dataset.i,1);persist();render()}
});
$('add').onclick=()=>{$('nm').value='';$('sk').value='';$('err').textContent='';$('sheet').classList.add('on')};
$('cancel').onclick=()=>$('sheet').classList.remove('on');
$('save').onclick=()=>{
  let name=$('nm').value.trim(),raw=$('sk').value.trim(),a={period:30,digits:6};
  try{
    if(/^otpauth:\/\//i.test(raw)){
      const u=new URL(raw),q=u.searchParams;
      a.secret=q.get('secret')||'';
      if(!name)name=decodeURIComponent(u.pathname.replace(/^\//,''))||q.get('issuer')||'Account';
      if(q.get('period'))a.period=+q.get('period')||30;
      if(q.get('digits'))a.digits=+q.get('digits')||6;
    }else a.secret=raw;
    if(!name)name='Account';
    b32(a.secret);
  }catch(e){$('err').textContent='Secret key ta thik na. Abar check koro.';return}
  a.name=name;accts.push(a);persist();$('sheet').classList.remove('on');render();
};
render();setInterval(render,1000);
</script>
</body>
</html>
